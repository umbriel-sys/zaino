# Zaino Configuration
#
# Generated with `zainod generate-config`
#
# Configuration sources are layered (highest priority first):
#   1. Environment variables (prefix: ZAINO_)
#   2. TOML configuration file
#   3. Built-in defaults
#
# For detailed documentation, see:
#   https://github.com/umbriel-sys/zaino
network = "PubTestnet"

[validator]
kind = "zcash_rpc"
rpc_address = "127.0.0.1:18232"

[indexes]
set = "full"
enable = []
disable = []
delete_stale = true

[indexes.paths]

[persistence]
path = "/var/cache/zaino"
write_buffer_mib = 64

[mempool]

[serve]
stream_timeout_secs = 30
stream_channel_size = 32

[serve.grpc]
listen_address = "127.0.0.1:8137"

[serve.grpc.limits]
concurrency_limit_per_connection = 32
max_concurrent_streams = 64
keepalive_interval_secs = 60
keepalive_timeout_secs = 20
shutdown_timeout_secs = 5
