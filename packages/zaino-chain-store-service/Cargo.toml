[package]
name = "zaino-chain-store-service"
version = "0.1.0"
description = "The chain store runtime: a configurable set of indexes over any Storage, built from the validator."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
zaino-chain-store = { workspace = true }
zaino-indexes = { version = "0.1.0", path = "../zaino-indexes" }
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence" }
zaino-primitives = { workspace = true, features = ["serde"] }
zaino-source = { workspace = true }
blake2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
futures.workspace = true
zaino-component.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence", features = ["testing"] }
zaino-persistence-lsm-tree = { path = "../zaino-persistence-lsm-tree" }
zaino-source-mock.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
