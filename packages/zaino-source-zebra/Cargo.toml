[package]
name = "zaino-source-zebra"
version = "0.2.2"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Composite Zebra source: routes each query to the transport that can answer it."

[dependencies]
zaino-primitives = { workspace = true, features = ["zebra"] }
zaino-source.workspace = true
zaino-source-zcash-rpc.workspace = true
zaino-rpc.workspace = true
zebra-chain = { workspace = true }
zebra-state = { workspace = true }
zebra-rpc.workspace = true
tokio = { workspace = true, features = ["sync"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true, optional = true }
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
zcash_address.workspace = true
zcash_protocol.workspace = true

[features]
tracing = ["dep:tracing"]

# Exposes the raw state handle for live tests that recompute expected chain
# data directly. Never enabled in production builds.
test_dependencies = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
