[package]
name = "zaino-proto"
description = "Holds tonic files and build logic for the lightwallet and darkside RPCs."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
version = "0.7.0"
# Upstream subtree tooling (CI, buf config), not crate content.
exclude = ["lightwallet-protocol/.github", "lightwallet-protocol/buf.yaml"]

[features]
default = ["heavy"]
heavy = ["dep:which"]
grpc_proxy_server = []
zaino-primitives = ["dep:zaino-primitives"]

[dependencies]

# Miscellaneous Workspace
tonic = { workspace = true }

# Miscellaneous Crate
prost = { workspace = true }
tonic-prost = "0.14"
zaino-primitives = { workspace = true, optional = true }

[build-dependencies]
which = { workspace = true, optional = true }
tonic-prost-build = "0.14"

[dev-dependencies]
proptest.workspace = true
