[package]
name = "zaino-indexes"
version = "0.1.0"
description = "Zaino's index set: per-field record layouts, index schemas, and one pure fold per index."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
# The domain vocabulary every record is decoded into.
zaino-primitives = { workspace = true, features = ["txout-commitment"] }

# The storage port: namespace shapes the layouts derive, and the digest a
# directory is stamped with.
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence" }

# The schema digest. BLAKE2b-256, as the rest of the tree hashes.
blake2 = { workspace = true }

thiserror.workspace = true

# The consensus branch ids each history-tree epoch is keyed by.
zaino-consensus = { version = "0.2.0", path = "../zaino-consensus" }

# C6's ZIP 221 chain history tree (D-61): node types V1-V3, MMR append and
# hashing, with upstream test vectors; `primitive-types` is its work type.
zcash_history = "0.6"
primitive-types = "0.12"

# I-11's per-transaction counts, shared structurally between states (D-69).
imbl.workspace = true

[dev-dependencies]
# The in-memory backend the index tests fold into.
zaino-persistence = { path = "../zaino-persistence", features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
