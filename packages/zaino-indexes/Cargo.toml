[package]
name = "zaino-indexes"
version = "0.1.0"
description = "Zaino's index set: per-field record layouts, index schemas, and one fold per index over the finalised chain."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
# The storage port: namespace shapes the layouts derive, and the digest a
# directory is stamped with.
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence" }

# The schema digest. BLAKE2b-256, as the rest of the tree hashes.
blake2 = { workspace = true }

thiserror.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
