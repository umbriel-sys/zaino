[package]
name = "zaino-source-zcash-rpc"
version = "0.2.2"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Zebra JSON-RPC adapter implementing zaino-source query traits."

[dependencies]
zaino-primitives = { workspace = true, features = ["zebra"] }
zaino-rpc = { workspace = true }
zaino-source = { workspace = true }
hex.workspace = true
zebra-chain = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }
incrementalmerkletree.workspace = true
zcash_primitives.workspace = true
sapling-crypto.workspace = true
tokio = { workspace = true, features = ["rt"] }

[features]
tracing = ["dep:tracing"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
