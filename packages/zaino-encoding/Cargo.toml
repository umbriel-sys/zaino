[package]
name = "zaino-encoding"
description = "Non-validating decoder: Zcash consensus bytes to Zaino's domain blocks and transactions."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
version = "0.1.0"

[dependencies]
blake2b_simd.workspace = true
orchard.workspace = true
sapling-crypto.workspace = true
sha2.workspace = true
thiserror.workspace = true
zaino-consensus.workspace = true
zaino-primitives.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dev-dependencies]
proptest.workspace = true
zaino-primitives = { workspace = true, features = ["zebra"] }
zcash_primitives = { workspace = true, features = ["test-dependencies"] }
zcash_protocol.workspace = true
zebra-chain = { workspace = true, features = ["proptest-impl"] }
zebra-test.workspace = true
