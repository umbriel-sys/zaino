[package]
name = "zaino-rpc"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared JSON-RPC 2.0 client: envelope, retry, auth. No validator knowledge."

[dependencies]
zaino-source = { workspace = true }
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
metrics = { workspace = true }
# The process-level provider `ensure_default_crypto_provider` installs
# (ADR-0006: aws-lc-rs, post-quantum key exchange preferred).
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "prefer-post-quantum",
] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
