[package]
name = "zaino-chain-store"
description = "Domain types and ports for Zaino's finalised chain state."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
version = "0.1.1"

[features]
default = []

[dependencies]
# The domain vocabulary, and the UTXO-set commitment every store computes.
# This crate names no wire, node, or backend type.
zaino-primitives = { workspace = true, features = ["txout-commitment"] }

# The validator ports the store reads through while building itself. Depending
# on the port crate rather than restating the questions keeps one definition of
# each, and lets any adapter that already answers them drive a store.
zaino-source = { workspace = true }

# Runtime status, so a consumer can ask how a store is faring through the same
# vocabulary every other subsystem reports in: a lifecycle phase and a health
# condition, read through `StatusSource`.
zaino-component = { workspace = true }

# Streams — the chunked block reads return one.
futures = { workspace = true }

# Runtime — the service port publishes watermark changes as a `watch`.
tokio = { workspace = true, features = ["sync"] }

# Utility
thiserror = { workspace = true }

[dev-dependencies]
# The compile-time check that a real validator satisfies `ChainStoreSource`.
zaino-source-zebra = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
