[package]
name = "zainod"
version = "0.10.1"
description = "Crate containing the Zaino Indexer binary."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[[bin]]
name = "zainod"
path = "src/main.rs"

[lib]
name = "zainodlib"
path = "src/lib.rs"

[features]
default = []

# Test-only seam: `Indexer::launch_inner_with_listeners` and the servers'
# `spawn_from_listener`, which serve on pre-bound listeners so a test harness
# can bind 127.0.0.1:0 and hand the open sockets over race-free.
test_dependencies = []

# TEST-ONLY seam: non-finalised depth 1001 -> 100 (NFS tests mine no 1k-block chain)
# - forwards to zaino-state (owns the depth constant)
fast-test-seam = ["zaino-state/fast-test-seam"]

# Removes network restrictions.
no_tls_use_unencrypted_traffic = ["tonic/tls-native-roots"]

# Operator build: no TLS + Prometheus metrics endpoint.
no_tls_with_prometheus = ["no_tls_use_unencrypted_traffic", "prometheus"]

# Prometheus /metrics scrape endpoint.
prometheus = ["dep:metrics-exporter-prometheus", "dep:metrics-process", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]

# DANGER: allows the JSON-RPC server to bind to a public (non-private,
# non-loopback) address. The JSON-RPC interface has NO transport encryption and
# is intended for loopback or trusted private networks only. Enabling this
# exposes unencrypted RPC to whatever network the bind address reaches. Only use
# for deployments on trusted private networks (e.g. containers behind a
# mesh/proxy that terminates encryption).
allow_unencrypted_public_json_rpc_bind = []

[dependencies]
zaino-primitives = { workspace = true, features = ["serde"] }
zaino-logging = { workspace = true }
zaino-rpc = { workspace = true }
zaino-state = { workspace = true }
zaino-chain-head-service = { workspace = true }

# Zebra
zebra-state = { workspace = true }

# Runtime
tokio = { workspace = true, features = ["full"] }

# CLI
clap = { workspace = true, features = ["derive"] }

# Tracing
tracing = { workspace = true }

# Network / RPC
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }

# Metrics: the names are always emitted; the exporter is behind "prometheus"
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
metrics-process = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["server", "http1"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
http-body-util = { workspace = true, optional = true }

# Utility
thiserror = { workspace = true }

# Formats
toml = { workspace = true }
config = { workspace = true }
zaino-mempool.workspace = true
zaino-component.workspace = true
zaino-proto.workspace = true
zebra-chain.workspace = true
zebra-rpc.workspace = true
futures.workspace = true
tower.workspace = true
hex.workspace = true
serde_json.workspace = true
indexmap.workspace = true
zaino-source.workspace = true
zaino-consensus.workspace = true
zaino-address.workspace = true
tonic = { workspace = true, features = ["tls-native-roots", "tls-aws-lc"] }
jsonrpsee = { workspace = true, features = ["server", "macros"] }

[dev-dependencies]
tempfile = { workspace = true }
zcash_address = { workspace = true }
zcash_protocol = { workspace = true }
