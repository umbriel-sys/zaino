[package]
name = "zaino-primitives"
description = "Zero-dependency Zcash chain-level domain types (heights, hashes, blocks, transactions) for the Zaino indexer."
version = "0.3.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
orchard = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
zcash_address.workspace = true
zcash_protocol.workspace = true
zebra-chain = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
# `zebra_chain` → domain conversions (the `zebra` module). Off by default; the
# crates that hold zebra types turn it on.
zebra = ["dep:zebra-chain", "dep:orchard"]
# `Serialize`/`Deserialize` on the configuration vocabulary (`Network`,
# `ActivationHeights`).
serde = ["dep:serde"]

[dev-dependencies]
proptest.workspace = true
zaino-consensus.workspace = true
