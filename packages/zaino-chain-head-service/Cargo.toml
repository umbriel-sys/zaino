[package]
name = "zaino-chain-head-service"
description = "Self-synchronising in-memory runtime for Zaino's ChainHead."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
version = "0.2.0"

[features]
default = []

# Extensions (D-50): one `zaino-indexes` fold each, run over the window and
# enabled through the builder. Each is its own feature so a head that serves
# none pulls in neither the indexes nor the persistence port. `txout_set`,
# `address_history` and `compact_blocks` resolve in-window spends through
# `transactions`.
transactions = ["dep:zaino-indexes", "dep:zaino-persistence"]
txout_set = ["transactions"]
address_history = ["transactions"]
compact_blocks = ["transactions"]
tree_state = ["dep:zaino-indexes", "dep:zaino-persistence"]
history_tree = ["dep:zaino-indexes", "dep:zaino-persistence"]

# TEST-ONLY: exposes `spawn_without_writer` and `advance_once`, so a downstream
# test crate can step the chain head deterministically instead of racing its
# timer. MUST appear only in `[dev-dependencies]` — `resolver = "2"` keeps
# dev-dependency features out of production dependency graphs. In-crate tests
# get both from `cfg(test)` without enabling anything.
testing = []

[dependencies]
zaino-chain-head = { workspace = true }
zaino-primitives = { workspace = true }
zaino-source = { workspace = true }
zaino-status = { workspace = true }
zaino-component = { workspace = true }

arc-swap = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

metrics = { workspace = true }
imbl.workspace = true
zaino-indexes = { version = "0.1.0", path = "../zaino-indexes", optional = true }
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence", optional = true }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "test-util"] }
zaino-consensus = { workspace = true }
zaino-source-mock.workspace = true
# The in-memory backend folds the oracles the extension tests compare against.
zaino-persistence = { version = "0.1.0", path = "../zaino-persistence", features = ["testing"] }
# The crate's own tests run with every extension on.
zaino-chain-head-service = { path = ".", features = [
    "transactions",
    "txout_set",
    "address_history",
    "tree_state",
    "history_tree",
] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
