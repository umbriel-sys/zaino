name: Live tests

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to run the suite against (blank = this branch)
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

# Per-PR: a push supersedes its own run, never another PR's.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The oldest zebrad the harness drives (`zaino_testutils::ZEBRAD_MIN_VERSION`).
  ZEBRAD_VERSION: "7.0.0"

jobs:
  compile:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            live-tests/target
          key: live-tests-compile-${{ hashFiles('live-tests/Cargo.lock') }}
          restore-keys: live-tests-compile-

      - name: Format
        run: cargo fmt --manifest-path live-tests/Cargo.toml --all --check

      - name: Clippy (all features)
        run: >
          cargo clippy --manifest-path live-tests/Cargo.toml
          --all-targets --all-features --locked -- -D warnings

  run:
    name: Run
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            live-tests/target
          key: live-tests-compile-${{ hashFiles('live-tests/Cargo.lock') }}
          restore-keys: live-tests-compile-

      # The release binary is taken out of the published image, which is
      # faster than building zebrad from source.
      - name: Install zebrad from the zfnd/zebra image
        run: |
          id=$(docker create "zfnd/zebra:${ZEBRAD_VERSION}")
          sudo docker cp "$id:/usr/local/bin/zebrad" /usr/local/bin/zebrad
          docker rm "$id"
          zebrad --version

      - uses: taiki-e/install-action@nextest

      # Keyed on what the harness keys its fixture directory on; a miss
      # rebuilds it in the builder test below.
      - name: Cache the fixture
        uses: actions/cache@v6
        with:
          path: live-tests/.cache
          key: fixture-${{ env.ZEBRAD_VERSION }}-${{ hashFiles('live-tests/zaino-testutils/src/cache.rs', 'live-tests/zaino-testutils/src/validator.rs', 'live-tests/Cargo.lock') }}

      - name: Build the fixture
        working-directory: live-tests
        run: cargo nextest run --locked -p clientless -E 'test(build_chain_cache)'

      - name: Run the live suite
        working-directory: live-tests
        run: cargo nextest run --locked --workspace
