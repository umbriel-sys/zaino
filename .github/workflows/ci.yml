name: CI

on:
  pull_request:
  push:
    branches: [dev]

# PR push supersedes its own run; every dev commit keeps its result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# No protoc: zaino-proto & zebra-rpc build.rs fall back to checked-in generated code
# (protoc present = regenerate over tracked sources)

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      # Full history: the changeset check diffs against the base branch
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/workbench
            tools/relman

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-deny,cargo-nextest

      # shellcheck is preinstalled on ubuntu-latest
      - run: cargo make lint
        env:
          RELMAN_BASE: origin/${{ github.base_ref || 'dev' }}

      - run: cargo nextest run --locked --workspace --no-fail-fast
