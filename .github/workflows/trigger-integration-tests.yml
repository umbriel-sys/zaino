name: Trigger Integration Tests

# Started by hand: asks zcash/integration-tests to run its suite against this
# ref. Needs the DISPATCH_APP_ID and DISPATCH_APP_PRIVATE_KEY secrets.
on:
  workflow_dispatch:
    inputs:
      test_sha:
        description: Revision of zcash/integration-tests to run (blank = its default)
        required: false
        type: string

permissions: {}

jobs:
  trigger-integration:
    name: Trigger integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DISPATCH_APP_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: zcash
          repositories: integration-tests

      - name: Trigger integration tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.sha }}
          TEST_SHA: ${{ inputs.test_sha }}
          # Stable per-source key so the integration repo can cancel a superseded run
          SOURCE_REF: ${{ github.ref_name }}
        run: >
          gh api repos/zcash/integration-tests/dispatches
          --field event_type="zaino-interop-request"
          --field client_payload[sha]="${SHA}"
          --field client_payload[test_sha]="${TEST_SHA}"
          --field client_payload[source_ref]="${SOURCE_REF}"
