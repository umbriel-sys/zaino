name: Container image

# Started by hand: builds the zainod images from docker/Dockerfile. Pushing
# needs the DOCKERHUB_USERNAME and DOCKERHUB_ACCESS_TOKEN secrets; without
# `push` the build only verifies the image.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the built images to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker:
    name: Container image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: default
            suffix: ''
            features: ''
          - variant: no-tls
            suffix: '-no-tls'
            features: no_tls_use_unencrypted_traffic
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: inputs.push
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/zainod
          flavor: |
            suffix=${{ matrix.suffix }}
          tags: |
            type=match,pattern=zainod-(.*),group=1
            type=ref,event=branch
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_FEATURES=${{ matrix.features }}
            ZAINO_GIT_COMMIT_ID=${{ github.sha }}
            ZAINO_GIT_BRANCH=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
