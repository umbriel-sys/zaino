[package]
name = "zaino-testutils"
description = "Live-test harness: validator and wallet ports, their zebrad and in-process librustzcash implementations, the in-process zainod launcher and the fixture cache."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
version = { workspace = true }
publish = false

[dependencies]
# In-process indexer and the types its handle exposes.
zainod = { workspace = true }
zaino-state = { workspace = true }
zaino-serve = { workspace = true }
zaino-primitives = { workspace = true }
zaino-proto = { workspace = true }
zcash_protocol = { workspace = true, features = ["local-consensus"] }

# Process launching, polling, RPC.
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
nix = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# Chain cache key and manifest.
sha2 = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }

# The rustls crypto provider reqwest's client needs.
zaino-rpc = { path = "../../packages/zaino-rpc" }
# `RUST_LOG`-driven tracing for the in-process indexer.
zaino-logging = { path = "../../packages/zaino-logging" }

# The in-process librustzcash wallet (`librustzcash` module).
zcash_client_backend = { version = "0.25", features = ["sync", "orchard", "transparent-inputs", "lightwalletd-tonic-transport"] }
zcash_client_sqlite = { version = "0.23", features = ["orchard", "transparent-inputs"] }
zcash_keys = { version = "0.17", features = ["sapling", "orchard", "transparent-inputs"] }
zcash_proofs = { version = "0.31", features = ["bundled-prover"] }
zcash_primitives = "0.31"
rusqlite = "0.37"
bip0039 = "0.14"
secrecy = "0.8"
rand = "0.10"
async-trait = "0.1"
zip32 = "0.3"

# The operational seam depth the fixture is sized against.
zaino-consensus = { path = "../../packages/zaino-consensus" }

# `legacy_parser` only.
zebra-chain = { workspace = true }
orchard = { workspace = true }

[dev-dependencies]
# Drives `legacy_parser::transaction`'s own round-trip tests.
wire_serialized_transaction_test_data = { workspace = true }
