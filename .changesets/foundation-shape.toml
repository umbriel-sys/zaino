[[changes]]
crate = "zaino-primitives"
kind = "feature"
description = """
Feature `zebra` adds the `zebra` module, the `zebra_chain` → domain \
conversions (`block_from_zebra`, `header_from_zebra`, \
`transaction_from_zebra`, `ConvertError`) that were the `zaino-convert-zebra` \
crate, with its consensus and difficulty agreement tests. Off by default; the \
crate's footprint is unchanged without it. `zaino-convert-zebra` is removed."""

[[changes]]
crate = "zaino-source-zcash-rpc"
kind = "breaking"
description = """
Renamed from `zaino-source-zebra-rpc`, and `ZebraRpcAdapter` to \
`ZcashRpcAdapter`: the adapter speaks the zcash JSON-RPC interface and names \
no validator. What the spec leaves to the node is read through a `Quirks` \
table (`ZcashRpcAdapter::with_quirks`); `new` reads every reply as the spec \
says, so a node's result cap is a failure unless its table reads it."""

[[changes]]
crate = "zaino-source-zebra"
kind = "breaking"
description = """
Absorbs `zaino-source-zebra-readstate`: `ZebraReadStateAdapter` and the \
`tracing` and `test_dependencies` features are this crate's. `rpc_adapter` \
builds the zcash RPC adapter with zebrad's quirk table (its `-8 more than \
{cap} … match` result cap), the one place that table lives. `ZebraValidator` \
takes a `ZcashRpcAdapter`."""

[[changes]]
crate = "zaino-state"
kind = "internal"
description = """
Builds its validator through `zaino_source_zebra::rpc_adapter` and the \
`zaino_primitives::zebra` conversions."""

[[changes]]
crate = "zaino-rpc"
kind = "feature"
description = """
Home of the network utilities every endpoint needs: `net` (address \
resolution: `resolve_socket_addr`, `try_resolve_address`, \
`AddressResolution`) and `ensure_default_crypto_provider` (the process-level \
rustls provider), both moved from `zaino-common`. No longer depends on \
`zaino-common`."""

[[changes]]
crate = "zaino-common"
kind = "breaking"
description = """
Being dissolved (D-10). `net`, `crypto` and `logging` are gone: address \
resolution and the crypto provider live in `zaino-rpc`, the tracing setup is \
`zaino-logging`, and `ValidatorConfig` is `zainod::config::ValidatorConfig`. \
What remains is the legacy stack's configuration types and `xdg`."""

[[changes]]
crate = "zainod"
kind = "internal"
description = """
Initialises logging through `zaino-logging`, resolves addresses through \
`zaino_rpc::net`, and owns `ValidatorConfig` (`zainod::config`)."""

[[changes]]
crate = "zaino-serve"
kind = "internal"
description = """
Takes the rustls provider from `zaino-rpc` instead of `zaino-common`."""
