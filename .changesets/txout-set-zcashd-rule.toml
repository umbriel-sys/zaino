[[changes]]
crate = "zaino-primitives"
kind = "breaking"
description = """
The UTXO set follows zcashd: `txout_commitment::is_unspendable(script)` \
excludes only `OP_RETURN` and scripts past `MAX_SCRIPT_SIZE` (10 000 bytes), \
so `txouts`, `transactions` and `total_amount` match zcashd's \
`gettxoutsetinfo` (on mainnet, 97 P2PK/multisig outputs holding 798 ZEC were \
left out). `commitment_address(script)` keys an output strictly."""

[[changes]]
crate = "zaino-chain-store"
kind = "breaking"
description = """
Re-exports the new rule; `is_legacy_unspendable(address)` keeps the \
P2PKH/P2SH-only rule for the address-key-only zainodb path until Stage 6."""
