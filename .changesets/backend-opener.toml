[[changes]]
crate = "zaino-persistence"
kind = "feature"
description = """
`Storage` and `Identity`: everything a multi-index store touches on disk, \
through one port: open, list and remove one backend directory per index, the \
store lock, and atomic, durable store files. `in_memory::InMemoryStorage` \
for tests.
"""

[[changes]]
crate = "zaino-persistence-lsm-tree"
kind = "feature"
description = """
`LsmTreeStorage` implements `Storage`. `remove_dir_all` deletes an index \
directory crash-safely behind a `REMOVING` marker, refused while open; an open \
finishes an interrupted removal. `Fs` gains `remove_dir` and `is_dir`; \
`REMOVING` is a reserved name.
"""
