consumed_in = "zainod-0-11-0"
# Stage 8: the repository sweep. Ownership moves to Umbriel Systems Ltd
# (https://github.com/umbriel-sys/zaino); docs, CI and tooling are rebuilt
# around the v2 tree.

[[changes]]
crate = "zainod"
kind = "breaking"
description = """
`GetLightdInfo.vendor` is "Umbriel Systems ZainoD". The startup banner no \
longer names a donation address. The container image is built from \
`docker/Dockerfile`; its entrypoint reads `ZAINO_PERSISTENCE__PATH` and \
`ZAINO_SERVE__JSONRPC__COOKIE_DIR`, and the build takes \
`ZAINO_GIT_COMMIT_ID` / `ZAINO_GIT_BRANCH` as build arguments."""
migration = """
A client that matched the old vendor string matches the new one. Build the \
image with `-f docker/Dockerfile` from the repository root; replace the old \
`ZAINO_STORAGE__DATABASE__PATH` and `ZAINO_JSON_SERVER_SETTINGS__COOKIE_DIR` \
variables with the new ones."""

[[changes]]
crate = "zaino-state"
kind = "breaking"
description = """
`GetLightdInfo.vendor` is "Umbriel Systems ZainoD". `ChainIndexSourcePorts` \
and `FinalisedSourceCaps` no longer require `OneShotGetTransaction`, which \
nothing behind them called. `z_validate_address`'s deprecation note names \
`zaino_address::DEPRECATION_NOTICE`."""
migration = """
Code that relied on either bound to imply `OneShotGetTransaction` names that \
port itself."""

[[changes]]
crate = "zainod"
kind = "fix"
description = """
`GetLightdInfo` refuses (`INTERNAL`) a validator whose upgrade schedule has \
no Sapling activation instead of reporting activation height 0."""

[[changes]]
crate = "zaino-state"
kind = "fix"
description = """
`get_lightd_info` returns an error for a validator whose upgrade schedule \
has no Sapling activation instead of reporting activation height 0."""

