[[changes]]
crate = "zaino-chain-store"
kind = "change"
description = """
`StoredTxOut` retired (D-51), with `SpentOutputIndex::previous_outputs`, \
`unspent_output` and `transparent_outputs`; `outputs_by_outpoint` answers \
outputs as the chain holds them. `LocatedOutput` carries the queried \
`address` and the full `TransparentOutput`; `LocatedSpend` carries the \
`address`, the `value` it removed and the spending `input_index`."""

[[changes]]
crate = "zaino-chain-store-service"
kind = "change"
description = """
Address effects read each received output from I-04 at the event's position \
and report each spend's input index; the three retired reads are removed."""

[[changes]]
crate = "zaino-chain-store-zainodb"
kind = "change"
description = """
The three retired reads and `stored_tx_out` are removed. The experimental \
address history answers `Unsupported`: zainodb stores script hashes, not \
scripts."""
