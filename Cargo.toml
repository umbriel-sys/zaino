# Workspace Members are in dependency order, do not change this without prior consideration.
[workspace]
members = [
    "packages/zaino-logging",
    "packages/zaino-async",
    "packages/zaino-component",
    "packages/zaino-consensus",
    "packages/zaino-primitives",
    "packages/zaino-encoding",
    "packages/zaino-persistence",
    "packages/zaino-persistence-lsm-tree",
    "packages/zaino-indexes",
    "packages/zaino-address",
    "packages/zaino-source-macros",
    "packages/zaino-source",
    "packages/zaino-source-mock",
    "packages/zaino-rpc",
    "packages/zaino-source-zcash-rpc",
    "packages/zaino-source-zebra",
    "packages/zaino-mempool",
    "packages/zaino-mempool-service",
    "packages/zaino-chain-head",
    "packages/zaino-chain-head-service",
    "packages/zaino-chain-store",
    "packages/zaino-chain-store-service",
    "packages/zaino-chain",
    "packages/zaino-service",
    "packages/zainod",
    "packages/zaino-state",
    "packages/zaino-proto",
    # NOTE: live-tests/ is its own standalone workspace (see
    # live-tests/Cargo.toml) with its own lockfile: it links zainod in-process
    # and drives a real zebrad. Build and run it from live-tests/.
]

# Use the edition 2021 dependency resolver in the workspace, to match the crates
resolver = "2"

[workspace.package]
authors = ["Umbriel Systems Ltd"]
repository = "https://github.com/umbriel-sys/zaino"
homepage = "https://github.com/umbriel-sys/zaino"
edition = "2021"
license = "Apache-2.0"
# Publish metadata shared by every published crate, inherited via
# `readme.workspace = true` etc. crates.io requires `description` + `license`;
# `readme`/`keywords`/`categories` round out what `clippy::cargo_common_metadata`
# checks (see the `clippy` task in Makefile.toml). `readme` is
# resolved from the workspace root.
readme = "README.md"
keywords = ["zcash", "blockchain", "indexer", "lightwallet"]
categories = ["cryptography::cryptocurrencies"]


[workspace.dependencies]

# Librustzcash. Pinned to the versions zebra-chain 15 links: these types cross
# into zebra's API, so they cannot diverge from zebra's (see
# docs/updating_zebra_crates.md).
incrementalmerkletree = "0.9"
orchard = "0.16"
sapling-crypto = "0.9"
zcash_address = "0.14"
zcash_keys = "0.17"
zcash_protocol = "0.11"
zcash_primitives = "0.31"
zcash_transparent = "0.11"

# Zebra (zebrad 7.0.0)
zebra-chain = "15.0"
zebra-state = "16.0"
zebra-rpc = "19.0"
zebra-test = "5.0"

# Runtime
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"

# CLI
clap = "4.0"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = [
    "fmt",
    "env-filter",
    "time",
    "json",
] }
tracing-tree = "0.4"
time = { version = "0.3", features = ["macros", "formatting"] }

# Network / RPC
http = "1.1"
hyper = "1.10"
hyper-util = "0.1"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = [
    "cookies",
    "rustls-no-provider",
    "webpki-roots",
] }
tower = { version = "0.4", features = ["buffer", "util"] }
tonic = { version = "0.14" }
prost = "0.14"
serde = "1.0"
serde_json = "1.0"
jsonrpsee = { version = "0.24", features = ["server", "macros"] }

# Hashmaps, channels, DBs
indexmap = "2.2.6"
futures = "0.3.30"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
metrics-process = "2.4"

# Utility
bytes = "1.12"
memmap2 = "0.9"
# sync_file_range (write-behind; no safe wrapper in rustix/nix)
libc = "0.2"
crc32fast = "1.4"
xorf = { version = "0.13", default-features = false, features = ["binary-fuse"] }
rayon = "1.12"
imbl = "7.0"
strum ={ version = "0.28", features = ["derive"] }
thiserror = "2.0"
chrono = "0.4"
which = "8"
whoami = "2.1"
sha2 = "0.10"
blake2 = "0.10"
# Personalised BLAKE2b for ZIP 244 txids: the implementation `orchard` and `zcash_primitives` use.
blake2b_simd = "1.0"
hex = "0.4"
toml = "1.1"

# Test
tempfile = "3.2"
# The tracing subscriber a binary installs, and the panic hook that logs
# through it.
zaino-logging = { path = "packages/zaino-logging", version = "0.2.0" }
# What a supervised component is: a lifecycle phase and a health condition as
# two independent axes, plus the ports to read and watch them.
zaino-component = { path = "packages/zaino-component", version = "0.2.0" }
# Consensus-derived constants (reorg bound, coinbase maturity, block size limit)
# and the protocol-limit validation built on them. A leaf that depends on no
# node implementation, so referencing a consensus fact costs neither a
# general-purpose dependency nor a peer's reading of the specification.
zaino-consensus = { path = "packages/zaino-consensus", version = "0.2.1" }
zaino-encoding = { path = "packages/zaino-encoding", version = "0.2.0" }
# Zero-dependency domain vocabulary. Every crate that needs chain-level types
# (heights, hashes, blocks, transactions) depends on this rather than on
# `zebra-chain` or on another zaino crate. The
# `zebra` feature adds the `zebra_chain` → domain conversions; only the crates
# that hold zebra types turn it on.
zaino-primitives = { path = "packages/zaino-primitives", version = "0.4.0" }
# Zcash address parsing and classification, for the two address-validation RPCs.
# A leaf: it isolates the librustzcash address stack from everything else.
zaino-address = { path = "packages/zaino-address", version = "0.2.0" }
# Driven port traits for validator access: one trait per question a consumer can
# ask, so each consumer's bound names exactly the capabilities it uses and an
# adapter that cannot answer a question simply does not implement it.
zaino-source = { path = "packages/zaino-source", version = "0.3.0" }
# One fake validator implementing every source port, for every crate's tests (dev-only).
zaino-source-mock = { path = "packages/zaino-source-mock" }
zaino-source-macros = { path = "packages/zaino-source-macros", version = "0.1.2" }
zaino-mempool = { path = "packages/zaino-mempool", version = "0.3.0" }
zaino-mempool-service = { path = "packages/zaino-mempool-service", version = "0.3.0" }
# JSON-RPC 2.0 transport shared by the RPC-backed source adapters.
zaino-rpc = { path = "packages/zaino-rpc", version = "0.4.0" }
# Source adapters. The RPC adapter answers every question over the Zcash
# JSON-RPC interface and names no validator; the zebra crate holds the
# ReadState adapter (the subset zebra's in-process state can serve), zebrad's
# RPC quirk table, and the composite that routes between the two.
zaino-source-zcash-rpc = { path = "packages/zaino-source-zcash-rpc", version = "0.3.0" }
zaino-source-zebra = { path = "packages/zaino-source-zebra", version = "0.3.0" }
# ChainHead: the bounded non-finalised block graph, its canonical chain, and the
# competing branches retained alongside it. This crate is the domain half —
# types and ports only, no runtime — so a consumer can name what ChainHead
# answers without depending on the service that answers it.
zaino-chain-head = { path = "packages/zaino-chain-head", version = "0.3.0" }
# The ChainHead runtime: owns the writer task that keeps the graph reconciled
# with the validator, and publishes each snapshot. Separate from the domain
# crate so a consumer can name what ChainHead answers without depending on the
# machinery that answers it.
zaino-chain-head-service = { path = "packages/zaino-chain-head-service", version = "0.3.0" }
# ChainStore: the finalised half of the chain — everything below the reorg
# seam, and the indexes built over it. This crate is the domain half: types and
# ports only, no storage, so a consumer can name what a store answers without
# depending on the implementation that answers it, and a second implementation
# is a matter of satisfying the traits. It also owns Zaino's UTXO-set
# commitment, which is a contract between implementations rather than any one
# implementation's business.
zaino-chain-store = { path = "packages/zaino-chain-store", version = "0.2.0" }
# The new chain store runtime: a configurable set of indexes over any Storage.
zaino-chain-store-service = { path = "packages/zaino-chain-store-service", version = "0.2.0" }
# ChainView: the unified chain read surface, composed from the two tiers above
# and validator passthrough. Unlike the subsystems it composes, this is one
# crate rather than a domain/adapter pair — the composer is generic over the
# ports either side, so it names no implementation and can sit beside the
# vocabulary it implements. A consumer bringing its own store and head depends
# on the same crate and writes its own composer against the same ports.
zaino-chain = { path = "packages/zaino-chain", version = "0.2.0" }
zaino-proto = { path = "packages/zaino-proto", version = "0.7.0" }


config = { version = "0.15", default-features = false, features = ["toml"] }
proptest = "1.12"
arc-swap = "1.7.1"

[profile.test]
opt-level = 3
debug = true

# Release codegen a profiler can attribute to source lines (`release` stays lean)
# - Frame pointers = other half, no Cargo key for them: pass
#   `-C force-frame-pointers=yes` via RUSTFLAGS alongside `--profile profiling`
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
